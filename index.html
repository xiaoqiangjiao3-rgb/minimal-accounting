<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>极简记账</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Tab1 记账 -->
        <div class="tab-content active" id="tab-bookkeeping">
            <header class="page-header">
                <h1 class="page-title">记账</h1>
                <div class="header-balance" id="header-balance">¥ 0.00</div>
            </header>

            <!-- 时间选择器 -->
            <div class="period-selector">
                <button class="period-arrow" id="period-prev">&lt;</button>
                <span class="period-label" id="period-label"></span>
                <button class="period-arrow" id="period-next">&gt;</button>
                <div class="period-mode-toggle">
                    <button class="mode-btn active" data-mode="month">月</button>
                    <button class="mode-btn" data-mode="year">年</button>
                </div>
            </div>

            <div class="input-card" id="input-card">
                <!-- 录音波形动画条 -->
                <div id="recording-wave" class="recording-wave hidden">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>

                <!-- 录音状态提示 - 整合到输入区域 -->
                <div id="recording-status" class="recording-status hidden">
                    <div class="recording-indicator">
                        <span class="recording-dot"></span>
                        <span class="recording-text">正在聆听...</span>
                    </div>
                    <div id="recording-preview" class="recording-preview"></div>
                </div>

                <!-- 收入/支出切换 -->
                <div class="type-toggle-row">
                    <button class="type-toggle-btn active" id="type-auto">自动</button>
                    <button class="type-toggle-btn" id="type-expense">支出</button>
                    <button class="type-toggle-btn" id="type-income">收入</button>
                </div>

                <!-- 输入行 - 整合语音按钮 -->
                <div class="input-row">
                    <!-- 极简线条麦克风图标 -->
                    <button id="voice-btn" class="voice-btn-inline" aria-label="语音输入">
                        <svg class="mic-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>
                    <input
                        type="text"
                        id="input-field"
                        class="apple-input"
                        placeholder="或直接打字输入"
                        autocomplete="off"
                    >
                    <button id="submit-btn" class="submit-btn">记</button>
                    <!-- 极简线条设置图标 -->
                    <button id="manage-cats-btn" class="settings-btn-inline" title="管理分类">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                </div>

                <div id="preview" class="preview-area hidden"></div>
                <div class="quick-cats">
                    <button class="cat-chip" data-cat="餐饮">🍲 餐饮</button>
                    <button class="cat-chip" data-cat="交通">🚗 交通</button>
                    <button class="cat-chip" data-cat="购物">🛍 购物</button>
                    <button class="cat-chip" data-cat="娱乐">🎮 娱乐</button>
                    <button class="cat-chip" data-cat="居住">🏠 居住</button>
                    <button class="cat-chip" data-cat="其他">📦 其他</button>
                </div>
            </div>

            <section class="records-section">
                <h2 class="section-label">账单明细</h2>
                <div id="records-grouped" class="records-grouped"></div>
            </section>
        </div>

        <!-- Tab2 图表 -->
        <div class="tab-content" id="tab-charts">
            <header class="page-header">
                <h1 class="page-title">图表</h1>
            </header>

            <div class="chart-filter-row">
                <button class="filter-chip active" data-filter="month">本月</button>
                <button class="filter-chip" data-filter="week">本周</button>
                <button class="filter-chip" data-filter="year">本年</button>
            </div>

            <div class="chart-card">
                <h2 class="section-label">支出分类</h2>
                <div class="chart-wrap">
                    <canvas id="pie-chart-expense"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2 class="section-label">收入分类</h2>
                <div class="chart-wrap">
                    <canvas id="pie-chart-income"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2 class="section-label">月度趋势</h2>
                <div class="chart-wrap">
                    <canvas id="line-chart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2 class="section-label">支出排行榜</h2>
                <div id="ranking-list-expense" class="ranking-list"></div>
            </div>

            <div class="chart-card">
                <h2 class="section-label">收入排行榜</h2>
                <div id="ranking-list-income" class="ranking-list"></div>
            </div>
        </div>

        <!-- Tab3 规划师 -->
        <div class="tab-content" id="tab-planner">
            <header class="page-header">
                <h1 class="page-title">规划师</h1>
                <button class="settings-gear" id="settings-gear-btn" title="设置">&#9881;</button>
            </header>

            <div class="health-card" id="health-card">
                <div class="health-header" id="health-header">
                    <div class="health-title-row">
                        <span class="health-title">财务健康评估</span>
                        <svg class="health-chevron" id="health-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,6 8,10 12,6"></polyline></svg>
                    </div>
                    <div class="health-score-row">
                        <div class="health-score-circle" id="health-score-circle">
                            <svg viewBox="0 0 80 80">
                                <circle class="score-bg" cx="40" cy="40" r="34" />
                                <circle class="score-fg" id="score-fg" cx="40" cy="40" r="34" />
                            </svg>
                            <span class="score-number" id="score-number">--</span>
                        </div>
                        <div class="health-score-info">
                            <div class="health-grade" id="health-grade">暂无数据</div>
                            <div class="health-grade-desc" id="health-grade-desc">请先记账</div>
                        </div>
                    </div>
                </div>
                <div class="health-detail" id="health-detail">
                    <div class="health-dimensions" id="health-dimensions"></div>
                </div>
            </div>

            <div class="planner-goal-card" id="goal-card">
                <div class="goal-status" id="goal-status">
                    <span class="goal-empty-hint">设定一个财务目标开始规划</span>
                </div>
                <div class="goal-input-row">
                    <input type="text" id="goal-input" class="apple-input" placeholder="我想3个月存2万" autocomplete="off">
                    <button id="goal-submit-btn" class="submit-btn">设</button>
                </div>
            </div>

            <section class="planner-chat" id="planner-chat">
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-bubble system">
                        <div class="chat-avatar">AI</div>
                        <div class="chat-text">
                            你好，我是你的财务规划师。<br>
                            设定一个目标（如"我想3个月存2万"），我会基于你的记账数据给出专业分析和建议。
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="bookkeeping">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="18" rx="2"/>
                    <line x1="2" y1="8" x2="22" y2="8"/>
                    <line x1="8" y1="3" x2="8" y2="8"/>
                </svg>
                <span>记账</span>
            </button>
            <button class="nav-item" data-tab="charts">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 20V10"/>
                    <path d="M12 20V4"/>
                    <path d="M6 20v-6"/>
                </svg>
                <span>图表</span>
            </button>
            <button class="nav-item" data-tab="planner">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20V10"/>
                    <path d="M18 20V4"/>
                    <path d="M6 20v-4"/>
                    <circle cx="12" cy="6" r="2"/>
                    <path d="M12 20c-3.3 0-6-2.7-6-6"/>
                    <path d="M12 20c3.3 0 6-2.7 6-6"/>
                </svg>
                <span>规划师</span>
            </button>
        </nav>
    </div>

    <!-- 分类管理模态框 -->
    <div class="cat-modal-overlay" id="cat-modal-overlay">
        <div class="cat-modal" id="cat-modal">
            <div class="cat-modal-header">
                <h2 class="cat-modal-title">管理分类</h2>
                <button class="cat-modal-close" id="cat-modal-close">&times;</button>
            </div>
            <div class="cat-modal-tabs">
                <button class="cat-tab-btn active" data-cat-tab="expense">支出分类</button>
                <button class="cat-tab-btn" data-cat-tab="income">收入分类</button>
            </div>
            <div class="cat-list" id="cat-list"></div>
            <button class="cat-add-btn" id="add-cat-btn">+ 添加分类</button>

            <div class="cat-edit-form" id="cat-edit-form">
                <h3 class="cat-form-title" id="cat-form-title">添加分类</h3>
                <div class="cat-form-field">
                    <label>名称</label>
                    <input type="text" id="cat-name-input" class="apple-input" placeholder="如：外卖">
                </div>
                <div class="cat-form-field">
                    <label>图标</label>
                    <div class="icon-picker" id="icon-picker"></div>
                    <input type="hidden" id="cat-icon-input" value="📦">
                </div>
                <div class="cat-form-field">
                    <label>颜色</label>
                    <input type="color" id="cat-color-input" value="#007AFF" class="cat-color-input">
                </div>
                <div class="cat-form-field">
                    <label>关键词（逗号分隔）</label>
                    <input type="text" id="cat-keywords-input" class="apple-input" placeholder="如：外卖,饿了么,美团">
                </div>
                <div class="cat-form-field">
                    <label>类型</label>
                    <select id="cat-type-select" class="apple-input">
                        <option value="expense">支出</option>
                        <option value="income">收入</option>
                    </select>
                </div>
                <div class="cat-form-actions">
                    <button class="cat-form-cancel" id="cat-form-cancel">取消</button>
                    <button class="cat-form-save" id="cat-form-save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-overlay" id="settings-overlay">
        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h2 class="settings-title">设置</h2>
                <button class="settings-close" id="settings-close">&times;</button>
            </div>
            <div class="settings-body">
                <div class="settings-section">
                    <h3 class="settings-section-title">AI 规划师</h3>
                    <p class="settings-hint">配置大模型 API 后，规划师可以回答更复杂的财务问题。</p>
                    <div class="settings-field">
                        <label>LLM 提供商</label>
                        <select class="apple-input" id="llm-provider-select">
                            <option value="gemini">Google Gemini（免费）</option>
                            <option value="openrouter">OpenRouter（免费模型）</option>
                        </select>
                    </div>
                    <div class="settings-field">
                        <label>API Key</label>
                        <input type="password" class="apple-input" id="llm-api-key-input" placeholder="输入你的 API Key">
                        <span class="settings-field-hint">Key 仅保存在本设备，不会上传</span>
                    </div>
                    <div class="settings-field">
                        <label>模型</label>
                        <input type="text" class="apple-input" id="llm-model-input" placeholder="gemini-1.5-flash">
                        <span class="settings-field-hint" id="llm-model-hint">Gemini 默认：gemini-1.5-flash</span>
                    </div>
                    <button class="settings-save-btn" id="settings-save-btn">保存</button>
                    <button class="settings-test-btn" id="settings-test-btn">测试连接</button>
                    <div class="settings-status" id="settings-status"></div>
                </div>
                <div class="settings-section">
                    <h3 class="settings-section-title">数据管理</h3>
                    <button class="settings-danger-btn" id="settings-export-btn">导出数据</button>
                    <button class="settings-danger-btn" id="settings-import-btn">导入数据</button>
                    <button class="settings-danger-btn danger" id="settings-clear-btn">清除所有数据</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
